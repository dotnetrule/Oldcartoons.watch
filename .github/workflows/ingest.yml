name: Ingest

# Runs the pipeline where the network is.
#
# Every network call in this project happens at build time, which assumes the
# machine holding the repo can reach YouTube. That is not always true — a
# sandboxed or offline environment can edit content/ and still have no route to
# youtube.com — so whitelisting a playlist and ingesting it are separable acts.
# A push that changes an ingest whitelist runs the pipeline here and commits the
# derived episodes back to the same branch.
#
# It pushes rather than opening a pull request, which is the opposite of what
# health-check.yml does. The difference is what is at stake: the health check
# proposes *removing* episodes from a live archive, which should be reviewed,
# while this only ever fills a branch in with data that branch just asked for.
# It never runs on Master.
on:
  push:
    branches-ignore:
      - Master
    paths:
      # The whitelists, and the machinery that reads them. A change to either
      # can change what the archive should contain, and a pipeline fix that
      # did not re-run the pipeline would leave the branch stale.
      - 'content/playlists.json'
      - 'content/channels.json'
      - 'content/videos.json'
      - 'content/series.json'
      - 'scripts/**'
      - '.github/workflows/ingest.yml'
  workflow_dispatch:

permissions:
  contents: write
  # Only to say on the pull request when this run finished. Nothing here
  # changes a pull request's state.
  pull-requests: write

# A second push while a run is in flight would race it to the same branch.
concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Attribution for any playlist whitelisted from its id alone. Optional:
      # an unreachable playlist keeps its null and the ingest carries on.
      - name: Resolve playlist attribution
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run resolve-playlists

      # --youtube-only because every series in content/ still carries a
      # placeholder TMDB id, which the TMDB half refuses by design. Drop the
      # flag once real ids land.
      - name: Fetch sources
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run fetch -- --youtube-only

      - name: Derive episodes
        run: npm run match

      # Which languages each new video can be heard in. One watch page per
      # video and no API key involved, so it runs after matching rather than
      # inside fetch, and only over rows nothing has read yet. A page that will
      # not talk leaves the row unread for next time; it never fails the run.
      #
      # Bounded, because this is the loop a person waits on. Unbounded it would
      # try the whole archive on a runner that has never scanned one — a page
      # each, thousands of them — and turn a two-minute ingest into an hour.
      # The ceiling is safe because the scan reads least-read sources first: a
      # playlist this very run whitelisted is at the front of the queue, so it
      # is always the newcomer that gets read and the backlog that waits.
      - name: Read audio tracks
        run: npm run scan-audio -- --limit 200

      # The Zod gate. A bad ingest fails here rather than being committed.
      - name: Validate
        run: npm run build-data

      - name: Commit the derived episodes
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- content/; then
            echo 'nothing changed — content/ already matches the sources'
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add content/
          git commit -m 'chore: ingest episodes from whitelisted sources'
          # Pushes authenticated with GITHUB_TOKEN do not trigger workflow runs,
          # so this cannot set itself off again.
          git push origin HEAD:${{ github.ref_name }}

          echo 'committed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # The number a reviewer actually wants: how much the archive can play
          # now, counted from the file rather than scraped out of a log line.
          echo "playable=$(node -e "
            const eps = require('./content/episodes.json');
            console.log(eps.filter((ep) => ep.status !== 'missing').length);
          ")" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Ingest'
            echo
            echo '```'
            git log -1 --stat --format='%s' -- content/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Say on the pull request that this run is done.
      #
      # This exists because of what the commit step above does: the episodes are
      # pushed to *this branch*, never to the default branch. A pull request
      # merged while this run is still going takes the code and leaves the data
      # on a closed branch — which has happened, twice, and each time the
      # archive came out empty while the diff looked complete. Nothing on the
      # pull request showed that a run was still in flight. Now something does.
      #
      # `if: always()` on purpose: a failed ingest is exactly the moment not to
      # merge, so it has to speak too.
      - name: Report to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          SHA: ${{ steps.commit.outputs.sha }}
          PLAYABLE: ${{ steps.commit.outputs.playable }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A push often lands before anyone opens the pull request. That is the
          # normal order of events here, not an error, so an absent one is
          # nothing to report and nothing to fail over.
          number=$(gh pr list --head "$GITHUB_REF_NAME" --state open \
                     --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "no open pull request for $GITHUB_REF_NAME — nothing to report"
            exit 0
          fi

          if [ "$STATUS" != 'success' ]; then
            verdict='**De ingest is mislukt.** Merge deze branch nog niet — de afleveringen die erbij horen staan er niet op.'
          elif [ "$COMMITTED" = 'true' ]; then
            verdict="**Klaar. Mergen kan nu veilig.** De afleveringen staan op deze branch in \`$SHA\`; het archief telt er $PLAYABLE speelbaar."
          else
            verdict='**Klaar, niets veranderd.** `content/` kwam al overeen met de bronnen, dus er valt niets te wachten en mergen kan.'
          fi

          # One comment per branch rather than one per push: this is a status,
          # and a status that appends is a thread nobody reads to the end.
          printf '%s\n\n[Ingest-run](%s)\n' "$verdict" "$RUN_URL" \
            | gh pr comment "$number" --edit-last --create-if-none --body-file -
