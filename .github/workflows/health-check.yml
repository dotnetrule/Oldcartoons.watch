name: Health check

# Weekly link rot sweep over every matched episode. Dead and un-embeddable
# videos are proposed as a pull request rather than pushed: an episode
# disappearing from the archive should be reviewable, not something that
# mutates production on a cron.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check every matched video
        id: health
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run health-check

      # Backfill, and re-checked on the same cadence. Runs after the health
      # check so it spends no page fetches on videos that sweep just dropped,
      # and only over rows nothing has read yet — a full archive scan happens
      # once, then this is a handful of new episodes a week. `--limit` keeps a
      # first run over an unscanned archive inside the job timeout; drop it
      # once the backlog is gone.
      - name: Read audio tracks
        id: audio
        run: npm run scan-audio -- --limit 400

      - name: Open a pull request for the diff
        if: steps.health.outputs.changed == 'true' || steps.audio.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: health-check/weekly
          # The branch carrying the pipeline. GitHub's default-branch pointer
          # still names feat/vue-implementation, which predates content/ and
          # would make this PR nonsense. Update if trunk moves.
          base: Master
          title: 'Health check: episode availability changed'
          commit-message: 'chore: weekly health check'
          body: |
            Automated weekly sweep of `content/episodes.json`.

            An episode flips to `missing` when its video is gone from YouTube or
            has embedding disabled — the player cannot load either one. Episodes
            that gained or lost a region restriction flip between `available` and
            `region-locked` and stay playable.

            The same run reads each video's audio tracks into `audioLanguages`.
            A video that gains a Dutch dub becomes schedulable on a Dutch
            station without its source changing language, so that half of the
            diff adds broadcasts rather than removing them.

            See the workflow run summary for the per-episode diff.
          labels: health-check
          delete-branch: true
