<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Matches the dark theme's default background (see src/data/themes.ts).
         Mobile browsers use this to tint chrome-adjacent surfaces — the
         status bar, the pull-to-refresh background, Safari's toolbar — none
         of which the page's own CSS can reach. App.vue keeps it in sync with
         the active theme once it is running, the same way it does for
         html/body; this is only the value those surfaces start from. -->
    <meta name="theme-color" content="#0B0F16" />
    <!-- The app is dark-only; this tells the browser itself, so native chrome
         it draws without any CSS hook of ours — form controls, non-WebKit
         scrollbars, autofill — renders dark instead of assuming light. -->
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="TV van Toen brengt Nederlandse jeugdzenders, hun programmering en klassieke programma’s opnieuw samen in één tv-gids." />
    <title>TV van Toen — zenders &amp; programmering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
